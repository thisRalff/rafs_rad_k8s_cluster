apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/thisRalff/rafs_rad_k8s_cluster.git
    targetRevision: main
    path: helm-charts/demo-app

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  # Keep synchronization manual until this repository is pinned to an approved
  # revision and its ClusterIP Service change has been pushed to the source repo.
