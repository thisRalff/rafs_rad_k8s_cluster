apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/thisRalff/rafs_rad_k8s_cluster.git
    targetRevision: main
    path: helm-charts/demo-app

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    # Argo creates the demo namespace; sync stays manual for this POC.
    # Network access is enforced by the Terraform operator ALB security group,
    # so no operator CIDR parameter is needed here.
    syncOptions:
      - CreateNamespace=true
