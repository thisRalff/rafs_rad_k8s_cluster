# Demo app - 3 pods behind one internal ClusterIP Service, each with a greeting.
# Terraform owns the restricted ALB ingress; Argo CD owns only these workloads.

pods:
  - name: hello
    message: "Hello World!"
  - name: ello
    message: "'Ello World!"
  - name: gday
    message: "G'day World!"

image:
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

service:
  # The Terraform-managed ALB Ingress reaches Pods through this internal Service.
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
