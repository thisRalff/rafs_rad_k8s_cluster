# Demo app - 3 pods behind one internal ClusterIP Service, each with a greeting.
# Argo CD owns everything in this chart, including the ALB Ingress below.

pods:
  - name: hello
    message: "Hello World!"
  - name: ello
    message: "'Ello World!"
  - name: gday
    message: "G'day World!"

image:
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

service:
  # The ALB Ingress reaches Pods through this internal Service.
  type: ClusterIP
  port: 80

ingress:
  # Joins the shared telp-operator ALB. Access restriction is enforced by the
  # Terraform-managed operator security group on that ALB, so no CIDR lives
  # here and the chart stays environment-agnostic and safe to commit publicly.
  enabled: true
  path: /

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
