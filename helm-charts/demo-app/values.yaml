# Demo app - 3 pods behind one LoadBalancer, each with a different greeting
# Change these messages and push to git -> ArgoCD syncs -> cluster updates

pods:
  - name: hello
    message: "Hello World!"
  - name: ello
    message: "'Ello World!"
  - name: gday
    message: "G'day World!"

image:
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
