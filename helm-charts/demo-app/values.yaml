# Demo app - 3 pods behind one internal ClusterIP Service, each with a greeting.
# Argo CD owns everything in this chart, including the ALB Ingress below.

pods:
  - name: hello
    message: "Hello World!"
  - name: ello
    message: "'Ello World!"
  - name: gday
    message: "G'day World!"

image:
  repository: nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

service:
  # The ALB Ingress reaches Pods through this internal Service.
  type: ClusterIP
  port: 80

ingress:
  # Enabled and IP-restricted via the Argo CD Application parameters, so the
  # operator CIDR is never committed to Git. Leaving inboundCidrs empty means
  # the ALB listener has no allow rule (effectively closed) until supplied.
  enabled: false
  path: /
  inboundCidrs: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
