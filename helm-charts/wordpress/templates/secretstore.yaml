# SecretStore: how ESO reaches AWS SSM. Auth uses the ESO controller's IRSA
# role (jwt/serviceaccount ref not needed here since ESO runs with the role).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}-ssm
  labels:
    app: {{ .Release.Name }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.externalSecrets.region }}
