# ExternalSecret: pulls the mapped SSM params into a Kubernetes Secret named
# after the release. The Deployment consumes this Secret via envFrom.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Release.Name }}-ssm
    kind: SecretStore
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
  data:
    {{- range $envName, $ssmPath := .Values.externalSecrets.parameters }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ $ssmPath }}
    {{- end }}
